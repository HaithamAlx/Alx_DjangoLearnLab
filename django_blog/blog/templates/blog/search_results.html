{% load static %}
<link rel="stylesheet" href="{% static 'blog/auth.css' %}">

<h2>Search Results for "{{ query }}"</h2>

{% if results %}
    <ul>
        {% for post in results %}
            <li>
                <a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a> by {{ post.author.username }}
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No posts found matching your query.</p>
{% endif %}

<a href="{% url 'post_list' %}">Back to All Posts</a>
