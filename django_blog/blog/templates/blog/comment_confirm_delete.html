{% load static %}
<link rel="stylesheet" href="{% static 'blog/auth.css' %}">

<h2>Delete Comment</h2>
<p>Are you sure you want to delete this comment?</p>
<p>"{{ comment.content }}"</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
</form>

<a href="{% url 'post_detail' comment.post.pk %}">Cancel</a>
